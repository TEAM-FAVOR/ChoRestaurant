<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" fill="none">
  <!-- Gourmet Ghanaian Jollof Rice Visual -->
  <defs>
    <linearGradient id="plateGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F1F5F9" />
    </linearGradient>
    <radialGradient id="jollofGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#EA580C" />
      <stop offset="65%" stop-color="#C2410C" />
      <stop offset="100%" stop-color="#9A3412" />
    </radialGradient>
    <linearGradient id="chickenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B45309" />
      <stop offset="60%" stop-color="#78350F" />
      <stop offset="100%" stop-color="#451A03" />
    </linearGradient>
    <linearGradient id="keleweleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#92400E" />
    </linearGradient>
  </defs>
  
  <rect width="600" height="400" fill="#FFF7ED" />
  
  <!-- Outer Ceramic Plate -->
  <circle cx="300" cy="200" r="165" fill="#E2E8F0" />
  <circle cx="300" cy="200" r="158" fill="url(#plateGrad)" stroke="#CBD5E1" stroke-width="2" />
  <circle cx="300" cy="200" r="135" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />
  
  <!-- Smoky Orange-Red Ghanaian Jollof Mountain -->
  <ellipse cx="280" cy="210" rx="95" ry="80" fill="url(#jollofGrad)" />
  <!-- Rice grain texture details -->
  <g fill="#FED7AA" opacity="0.6">
    <ellipse cx="250" cy="180" rx="5" ry="2" transform="rotate(20 250 180)" />
    <ellipse cx="270" cy="170" rx="4" ry="2" transform="rotate(-30 270 170)" />
    <ellipse cx="295" cy="185" rx="5" ry="2" transform="rotate(45 295 185)" />
    <ellipse cx="240" cy="215" rx="5" ry="2" transform="rotate(10 240 215)" />
    <ellipse cx="275" cy="225" rx="4" ry="2" transform="rotate(-15 275 225)" />
    <ellipse cx="310" cy="210" rx="5" ry="2" transform="rotate(35 310 210)" />
    <ellipse cx="260" cy="245" rx="5" ry="2" transform="rotate(-40 260 245)" />
  </g>
  
  <!-- Grilled Spiced Chicken Drumstick / Thigh -->
  <g transform="translate(325, 140) rotate(15)">
    <path d="M20 30 C5 45 10 95 40 100 C70 105 85 70 70 40 C60 20 35 15 20 30 Z" fill="url(#chickenGrad)" />
    <!-- Grill marks -->
    <line x1="28" y1="42" x2="55" y2="48" stroke="#291205" stroke-width="3" stroke-linecap="round" />
    <line x1="32" y1="60" x2="65" y2="66" stroke="#291205" stroke-width="3.5" stroke-linecap="round" />
    <line x1="38" y1="78" x2="68" y2="84" stroke="#291205" stroke-width="3" stroke-linecap="round" />
    <!-- Bone knob -->
    <path d="M18 28 L0 10 C-5 5 -2 -2 5 0 L15 15" stroke="#F1F5F9" stroke-width="8" stroke-linecap="round" />
  </g>
  
  <!-- Golden Fried Kelewele (Spiced Ripe Plantain Cubes) -->
  <g transform="translate(195, 230)">
    <rect x="0" y="0" width="22" height="15" rx="4" fill="url(#keleweleGrad)" transform="rotate(-15)" />
    <rect x="25" y="8" width="20" height="14" rx="4" fill="url(#keleweleGrad)" transform="rotate(25 25 8)" />
    <rect x="10" y="20" width="22" height="15" rx="4" fill="url(#keleweleGrad)" transform="rotate(5 10 20)" />
  </g>
  
  <!-- Black Shito Pepper Dollop -->
  <ellipse cx="360" cy="245" rx="20" ry="14" fill="#1C1917" />
  <ellipse cx="362" cy="243" rx="14" ry="8" fill="#44403C" opacity="0.7" />
  
  <!-- Fresh Parsley/Cilantro Herb Garnish -->
  <path d="M285 160 C275 145 285 135 295 145 C305 135 315 145 305 160 Z" fill="#16A34A" />
  <path d="M295 145 L295 168" stroke="#15803D" stroke-width="2" />
  
  <!-- Subtle Tag -->
  <rect x="20" y="20" width="120" height="30" rx="15" fill="#E65100" />
  <text x="80" y="40" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="12" fill="#FFFFFF">
    ★ CHEF'S SPECIAL
  </text>
</svg>
