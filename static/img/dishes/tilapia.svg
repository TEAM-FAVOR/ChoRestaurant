<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" fill="none">
  <!-- Banku & Grilled Tilapia Visual -->
  <defs>
    <linearGradient id="fishGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9A3412" />
      <stop offset="45%" stop-color="#78350F" />
      <stop offset="100%" stop-color="#451A03" />
    </linearGradient>
    <radialGradient id="bankuGrad" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="80%" stop-color="#E2E8F0" />
      <stop offset="100%" stop-color="#CBD5E1" />
    </radialGradient>
  </defs>
  
  <rect width="600" height="400" fill="#F0FDF4" />
  
  <!-- Ceramic Oval Platter -->
  <ellipse cx="300" cy="200" rx="220" ry="140" fill="#E2E8F0" />
  <ellipse cx="300" cy="200" rx="212" ry="132" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2" />
  
  <!-- Banku Dough Balls (Smooth Fermented Corn/Cassava) -->
  <ellipse cx="180" cy="180" rx="55" ry="50" fill="url(#bankuGrad)" />
  <ellipse cx="205" cy="230" rx="48" ry="42" fill="url(#bankuGrad)" />
  
  <!-- Grilled Volta Tilapia Fish -->
  <g transform="translate(240, 120)">
    <path d="M10 80 C40 20 180 20 220 80 C180 140 40 140 10 80 Z" fill="url(#fishGrad)" />
    <!-- Tail Fin -->
    <path d="M215 80 L250 50 L240 80 L250 110 Z" fill="#78350F" />
    <!-- Head and Eye -->
    <circle cx="45" cy="75" r="5" fill="#FEF08A" />
    <circle cx="45" cy="75" r="2.5" fill="#1C1917" />
    <path d="M60 45 C75 75 75 90 60 115" stroke="#451A03" stroke-width="3" stroke-linecap="round" />
    <!-- Diagonal Spiced Charred Cuts -->
    <line x1="90" y1="45" x2="115" y2="115" stroke="#1C1917" stroke-width="3.5" stroke-linecap="round" />
    <line x1="125" y1="45" x2="150" y2="115" stroke="#1C1917" stroke-width="3.5" stroke-linecap="round" />
    <line x1="160" y1="50" x2="182" y2="110" stroke="#1C1917" stroke-width="3.5" stroke-linecap="round" />
    <!-- Garnish Herbs on Fish -->
    <ellipse cx="130" cy="65" rx="10" ry="5" fill="#16A34A" transform="rotate(-20 130 65)" />
    <ellipse cx="155" cy="85" rx="8" ry="4" fill="#22C55E" transform="rotate(30 155 85)" />
  </g>
  
  <!-- Red and Green Ground Hot Pepper Sauces -->
  <g transform="translate(190, 275)">
    <!-- Red pepper -->
    <ellipse cx="40" cy="10" rx="26" ry="18" fill="#DC2626" />
    <ellipse cx="38" cy="8" rx="18" ry="10" fill="#EF4444" opacity="0.8" />
    <!-- Green pepper -->
    <ellipse cx="100" cy="10" rx="26" ry="18" fill="#15803D" />
    <ellipse cx="98" cy="8" rx="18" ry="10" fill="#22C55E" opacity="0.8" />
    <!-- Diced onions / tomatoes -->
    <circle cx="35" cy="8" r="4" fill="#FFFFFF" />
    <circle cx="48" cy="12" r="3.5" fill="#FEF08A" />
    <circle cx="95" cy="7" r="4" fill="#FFFFFF" />
  </g>
</svg>
