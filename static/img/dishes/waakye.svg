<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" fill="none">
  <!-- Waakye Special Visual -->
  <defs>
    <radialGradient id="waakyeGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4A0404" />
      <stop offset="70%" stop-color="#3B0712" />
      <stop offset="100%" stop-color="#1F040A" />
    </radialGradient>
  </defs>
  <rect width="600" height="400" fill="#FEF2F2" />
  <!-- Traditional Banana Leaf / Platter Base -->
  <ellipse cx="300" cy="205" rx="200" ry="140" fill="#15803D" />
  <ellipse cx="300" cy="205" rx="192" ry="132" fill="#16A34A" />
  <line x1="110" y1="205" x2="490" y2="205" stroke="#14532D" stroke-width="3" stroke-dasharray="12 6" />
  
  <!-- Burgundy-brown Waakye (Rice & Black Eyed Beans) -->
  <ellipse cx="280" cy="205" rx="100" ry="75" fill="url(#waakyeGrad)" />
  <circle cx="260" cy="180" r="4" fill="#991B1B" />
  <circle cx="295" cy="190" r="4.5" fill="#991B1B" />
  <circle cx="240" cy="210" r="4" fill="#991B1B" />
  
  <!-- Wele (Tender Cowhide) & Stew -->
  <rect x="230" y="145" width="35" height="24" rx="6" fill="#78350F" />
  <rect x="245" y="138" width="28" height="20" rx="5" fill="#9A3412" />
  
  <!-- Spaghetti & Gari Foto Toppings -->
  <path d="M330 170 Q350 160 370 175 Q360 190 380 185" stroke="#FBBF24" stroke-width="4" fill="none" stroke-linecap="round" />
  <path d="M335 180 Q360 170 375 195" stroke="#FDE047" stroke-width="3.5" fill="none" stroke-linecap="round" />
  <!-- Gari (golden toasted cassava grit) -->
  <ellipse cx="350" cy="235" rx="30" ry="20" fill="#F59E0B" opacity="0.85" />
  
  <!-- Boiled Egg Halves -->
  <ellipse cx="200" cy="235" rx="24" ry="18" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />
  <circle cx="204" cy="235" r="10" fill="#EAB308" />
  
  <!-- Dark Shito -->
  <circle cx="310" cy="255" r="16" fill="#0C0A09" />
</svg>
