  <circle cx="300" cy="155" r="12" fill="#9A3412" />
  <!-- Steam lines -->
  <path d="M275 135 Q265 115 275 95" stroke="#FB923C" stroke-width="3" stroke-linecap="round" fill="none" />
  <path d="M300 130 Q310 110 300 90" stroke="#FB923C" stroke-width="3.5" stroke-linecap="round" fill="none" />
  <path d="M325 135 Q335 115 325 95" stroke="#FB923C" stroke-width="3" stroke-linecap="round" fill="none" />
