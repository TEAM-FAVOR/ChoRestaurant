<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" fill="none">
  <!-- General Fallback Gourmet Dish Plate Visual -->
  <defs>
    <radialGradient id="plateBase" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="85%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </radialGradient>
    <linearGradient id="mealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EA580C" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="#FFF7ED" />
  <circle cx="300" cy="200" r="160" fill="#E2E8F0" />
  <circle cx="300" cy="200" r="150" fill="url(#plateBase)" stroke="#CBD5E1" stroke-width="2" />
  <circle cx="300" cy="200" r="120" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />
  
  <!-- Cloche / Chef Dish Icon Motif -->
