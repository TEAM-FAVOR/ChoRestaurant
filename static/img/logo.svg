<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" fill="none">
  <!-- Cho Restaurant Logo -->
  <defs>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E65100" />
      <stop offset="100%" stop-color="#FF8F00" />
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2E7D32" />
      <stop offset="100%" stop-color="#4CAF50" />
    </linearGradient>
  </defs>
  
  <!-- Icon Emblem: Gourmet Cloche + Flame/Herb Motif -->
  <g transform="translate(10, 8)">
    <circle cx="32" cy="32" r="30" fill="url(#logoGrad)" />
    <!-- Cloche dome -->
    <path d="M17 40 C17 26 47 26 47 40 Z" fill="#FFFFFF" />
    <!-- Cloche base plate -->
    <rect x="14" y="41" width="36" height="3" rx="1.5" fill="#FFFFFF" />
    <!-- Cloche handle knob -->
    <circle cx="32" cy="24" r="3.5" fill="#FFFFFF" />
    <!-- Fresh Herb Leaf Accents -->
    <path d="M38 16 C44 14 46 8 46 8 C46 8 40 10 38 16 Z" fill="url(#leafGrad)" />
    <path d="M42 17 C46 20 50 18 50 18 C50 18 47 16 42 17 Z" fill="#81C784" />
  </g>
  
  <!-- Brand Typography -->
  <text x="82" y="44" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-weight="900" font-size="30" fill="#1E293B" letter-spacing="-0.5">
    CHO<tspan fill="#E65100">.</tspan>
  </text>
  <text x="82" y="62" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-weight="600" font-size="11" fill="#64748B" letter-spacing="3.5">
    RESTAURANT &amp; GRILL
  </text>
</svg>
