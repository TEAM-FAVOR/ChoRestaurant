<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none">
  <!-- Order Success / Confirmation Celebration Illustration -->
  <defs>
    <linearGradient id="successGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#16A34A" />
      <stop offset="100%" stop-color="#22C55E" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DCFCE7" />
      <stop offset="100%" stop-color="#F0FDF4" />
    </linearGradient>
  </defs>
  
  <circle cx="200" cy="140" r="90" fill="url(#glowGrad)"/>
  <circle cx="200" cy="140" r="60" fill="url(#successGrad)"/>
  
  <!-- Checkmark -->
  <path d="M182 140 L195 153 L222 124" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Confetti / Culinary Celebration accents -->
  <circle cx="120" cy="90" r="5" fill="#F59E0B"/>
  <rect x="270" y="80" width="8" height="8" rx="2" fill="#E65100" transform="rotate(25 270 80)"/>
  <circle cx="280" cy="150" r="6" fill="#3B82F6"/>
  <rect x="110" y="170" width="10" height="6" rx="2" fill="#10B981" transform="rotate(-30 110 170)"/>
  <circle cx="160" cy="60" r="4" fill="#EC4899"/>
  <circle cx="240" cy="65" r="5" fill="#8B5CF6"/>
  
  <text x="200" y="245" text-anchor="middle" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-weight="800" font-size="20" fill="#1E293B">
    Order Placed Successfully!
  </text>
  <text x="200" y="270" text-anchor="middle" font-family="'Inter', sans-serif" font-weight="500" font-size="14" fill="#64748B">
    The kitchen is preparing your freshly cooked meal.
  </text>
</svg>
